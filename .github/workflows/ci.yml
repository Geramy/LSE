name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# One GPU. Stacked runs would contend and time out rather than queue cleanly,
# and an obsolete run of an amended branch is worth nothing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # This repository is public and this runner is somebody's workstation. A
    # pull request from a fork must never execute on it, so the job runs for
    # branches of this repository only. A fork's pull request leaves this
    # check unreported, which a branch rule then blocks on until a maintainer
    # brings the change onto a branch here.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, lse]
    # A toolchain change on the runner invalidates the whole JIT cache (the
    # cache key fingerprints comgr and its bitcode), and one cold rebuild of
    # every kernel on this GPU takes about an hour. Warm runs take minutes.
    timeout-minutes: 150
    env:
      ROCM_PATH: ${{ vars.LSE_ROCM_PATH || '/opt/rocm' }}
      HRX_ROOT: ${{ vars.LSE_HRX_ROOT }}
      FASTOKENS_REF: ${{ vars.LSE_FASTOKENS_REF || '7973014e4f3a6028ac48f305704eacd64d0b4ef6' }}
      LSE_SMOKE_MODEL: ${{ vars.LSE_SMOKE_MODEL || 'mlx-community/Qwen3.5-0.8B-4bit' }}

    steps:
      - uses: actions/checkout@v4

      - name: Describe the toolchain this runner will JIT with
        # The device compiler is picked up at run time, not at build time: the
        # engine loads libamd_comgr and comgr loads the device-library bitcode
        # beside it. When those two come from different LLVM majors every
        # kernel fails to compile and the engine runs on the host. Printed
        # every run so a drift on the runner names itself in the log.
        run: |
          set +e
          echo "ROCM_PATH=$ROCM_PATH -> $(readlink -f "$ROCM_PATH")"
          ls -d /opt/rocm* 2>/dev/null
          for r in $(ls -d /opt/rocm* 2>/dev/null | xargs -n1 readlink -f | sort -u); do
            echo "== $r"
            ls -la "$r"/lib/libamd_comgr.so* 2>/dev/null | head -3
            [ -x "$r/llvm/bin/clang" ] && "$r/llvm/bin/clang" --version | head -1
            [ -f "$r/amdgcn/bitcode/ocml.bc" ] && echo "ocml.bc: $(head -c 24 "$r/amdgcn/bitcode/ocml.bc" | od -An -c | head -1)"
            ls "$r"/.info/version* 2>/dev/null | head -2; cat "$r"/.info/version 2>/dev/null
          done
          env | grep -iE "^(ROCM|HIP|HSA|COMGR|LD_LIBRARY)" | sort
          ldconfig -p | grep -E "amd_comgr|hsa-runtime" | head -6
          command -v hipcc && hipcc --version | head -3

      - name: Provision the reference dependencies
        run: |
          set -euo pipefail
          # reference/ is ignored, so a fresh checkout has none of it and the
          # tokenizer's Rust shim cannot resolve its path dependency.
          mkdir -p reference
          if [ ! -f reference/fastokens/Cargo.toml ]; then
            git clone --quiet https://github.com/crusoecloud/fastokens.git reference/fastokens
            git -C reference/fastokens checkout --quiet "$FASTOKENS_REF"
          fi

      - name: Configure
        run: |
          set -euo pipefail
          # g++-16 is not optional: the host sources are C++26 and reflect over
          # kernel argument structs. Say so here rather than in the headers.
          command -v g++-16 >/dev/null || {
            echo "::error::g++-16 not found; the host sources need P2996 reflection."
            exit 1
          }
          hrx_arg=""
          if [ -n "${HRX_ROOT:-}" ] && [ -d "$HRX_ROOT" ]; then
            hrx_arg="-DLSE_HRX_ROOT=$HRX_ROOT"
          else
            echo "::error::No HRX install at '${HRX_ROOT:-<unset>}'. CI builds and tests the GPU path; a CPU-only build passes every check while testing nothing that matters. Set the repository variable LSE_HRX_ROOT."
            exit 1
          fi
          cmake -S . -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-16 \
            -DLSE_ROCM_PATH="$ROCM_PATH" \
            $hrx_arg

      # Not -Werror: g++ 16 reports a -Wnonnull from inside libstdc++'s own
      # <string>, so requiring it would fail every pull request on a header
      # nobody here wrote. Our own sources build clean and the release build
      # would show it if that stopped being true.
      - name: Build
        run: cmake --build build

      # Kernel emission and numerics against the CPU reference live here:
      # test_graph, test_jit and test_model are what catch a changed kernel
      # that no longer computes what it did.
      - name: Test
        run: |
          set -euo pipefail
          # The engine dlopens comgr at run time and comgr loads the bitcode
          # beside it, so the JIT must find the SAME ROCm runtime the build was
          # configured against — first on the path, ahead of any distro comgr
          # the linker cache would otherwise offer (a clang-21 comgr next to
          # clang-23 bitcode failed every kernel here once). cmake already
          # resolved that directory; read it back rather than guess it.
          RT="$(sed -n 's/^LSE_ROCM_RUNTIME_DIR:PATH=//p' build/CMakeCache.txt)"
          echo "ROCm runtime for the JIT: ${RT:-<unresolved>}"
          export LD_LIBRARY_PATH="${RT:+$RT:}$ROCM_PATH/lib:${HRX_ROOT:-}/lib:${LD_LIBRARY_PATH:-}"
          # Names the reuse gate a replay tripped, and which pass replayed.
          export LSE_DEBUG_REUSE=1
          ctest --test-dir build --output-on-failure

      - name: Smoke test the engine and the HTTP API
        run: |
          set -euo pipefail
          RT="$(sed -n 's/^LSE_ROCM_RUNTIME_DIR:PATH=//p' build/CMakeCache.txt)"
          export LD_LIBRARY_PATH="${RT:+$RT:}$ROCM_PATH/lib:${HRX_ROOT:-}/lib:${LD_LIBRARY_PATH:-}"
          if ! ./build/lse --list-cache 2>/dev/null | grep -q "$LSE_SMOKE_MODEL"; then
            echo "::error::$LSE_SMOKE_MODEL is not cached on this runner. The end-to-end check asserts on generated text and on the work running on the device, and neither can be checked without the weights."
            exit 1
          fi
          .github/scripts/smoke.sh build
